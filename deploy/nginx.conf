# ThrivIT on a small VPS with nginx. Copy the contents of web/dist to /var/www/thrivit, then include this server block.
server {
    listen 80;
    server_name thrivit.dev www.thrivit.dev;   # your domain
    root /var/www/thrivit;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript image/svg+xml;

    # file names in assets/ carry a content hash, so they can be cached for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # the page itself is always revalidated, so a new deploy shows up at once
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
